name: streak_reader
description: "PDF reader with reading streak tracking"
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod: ^2.5.1

  # Local database
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # PDF reader (Arabic RTL support)
  pdfrx: ^1.0.98

  # File picker
  file_picker: ^8.1.2

  # Settings persistence (all platforms incl. web)
  shared_preferences: ^2.3.2

  # Utils
  intl: ^0.20.2
  timezone: ^0.11.2
  flutter_local_notifications: ^22.3.3
  flutter_timezone: ^5.1.1
  supabase_flutter: ^2.18.3
  home_widget: ^0.7.0
  pdf: ^3.11.3
  share_plus: ^10.1.4
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code generation
  build_runner: ^2.4.13
  drift_dev: ^2.20.3

dependency_overrides:
  archive: ^4.6.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    # Reading-optimised body face (Arabic + Latin).
    - family: ReadexPro
      fonts:
        - asset: assets/fonts/ReadexPro-400.ttf
          weight: 400
        - asset: assets/fonts/ReadexPro-500.ttf
          weight: 500
        - asset: assets/fonts/ReadexPro-600.ttf
          weight: 600
        - asset: assets/fonts/ReadexPro-700.ttf
          weight: 700
    # Editorial display face for headings and numbers.
    - family: Alexandria
      fonts:
        - asset: assets/fonts/Alexandria-600.ttf
          weight: 600
        - asset: assets/fonts/Alexandria-700.ttf
          weight: 700
